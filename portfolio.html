    <style>
        /* Estilos base tomados de tu index.html */
        :root {
            --primary-color: #55c7a5;
            /* Color verde/lima ajustado */
            --secondary-color: #2c3e50;
            --background-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-background: #4a455e;
            --header-background: #121212;
            --progress-color: var(--primary-color);
            /* Color de la barra de progreso */
        }

        /* Estilos específicos para la página de Tareas */

        /* Usa la misma fuente y fondo que el index */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url(images/background.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            color: var(--text-color);
        }

        #task-content {
            padding: 50px 0;
            /* Asegura espacio suficiente */
            min-height: 100vh;
            margin-left: 100px;
            /* Deja espacio para el menú lateral */
        }

        .section-title {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 50px;
            font-weight: 700;
        }

        /* Estilo para las tarjetas de Semana (Grid) */
        .semana-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .semana {
            background-color: var(--card-background);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(155, 33, 33, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .semana:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        .semana-header {
            cursor: pointer;
            padding: 15px;
            background-color: var(--header-background);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s ease;
        }

        .semana-header.active {
            background-color: var(--secondary-color);
        }

        .semana-header h3 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-color);
            transition: color 0.3s ease;
        }

        .semana-header .github-link {
            font-size: 1.5rem;
            color: var(--primary-color);
            transition: transform 0.3s ease;
        }

        .semana-header .github-link:hover {
            transform: scale(1.1);
        }

        /* Progreso y Barra */
        .progreso-container {
            margin: 10px 15px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progreso-barra {
            height: 100%;
            width: 0%;
            background-color: var(--progress-color);
            transition: width 0.4s ease;
        }

        /* Contenido de las tareas (Acordeón) */
        .tareas {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            padding: 0 15px;
        }

        .tareas.show {
            max-height: 1000px;
            /* Suficiente para expandirse */
            padding-bottom: 15px;
        }

        .tarea {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            transition: background-color 0.2s ease;
        }

        .tarea:last-child {
            border-bottom: none;
        }

        .tarea-completada .tarea-descripcion {
            text-decoration: line-through;
            color: rgba(255, 255, 255, 0.5);
        }

        .tarea-checkbox {
            margin-right: 15px;
            transform: scale(1.2);
        }

        .tarea-descripcion {
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .tarea-acciones .btn {
            font-size: 0.8rem;
            padding: 5px 10px;
            margin-left: 10px;
            border: none;
            background-color: var(--primary-color);
            color: var(--background-color);
            font-weight: 600;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .tarea-acciones .btn:hover {
            background-color: #4838a0;
            /* Un poco más oscuro */
        }

        .tarea-img-container {
            height: 150px;
            overflow: hidden;
            background-color: #000;
        }

        .tarea-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: filter 0.3s ease;
        }

        .semana:hover .tarea-img {
            filter: grayscale(0%);
        }

        /* Responsive Design */
        @media (max-width: 991px) {
            #task-content {
                margin-left: 0;
                /* Elimina el margen en móviles */
                padding-top: 20px;
            }
        }
    </style>

    // Función para generar una tarjeta de semana
    function crearTarjetaSemana(data) {
        // NOTA: Para simplificar, la ruta completa del archivo (ej. Archivos-clase/semana1/tarea_s01_intro_git.pdf)
        // se ha movido directamente a la propiedad `archivo` de `tareasData`.
        // Esto evita la manipulación compleja de strings de URL aquí.

        const tareasHtml = data.tareas.map((tarea, index) => `
            <div class="tarea" data-tarea-index="${index}">
                <input type="checkbox" class="tarea-checkbox" onclick="marcarTarea(this)">
                <span class="tarea-descripcion">${tarea.nombre}</span>
                <div class="tarea-acciones">
                    <a href="${data.githubRepo}" target="_blank" class="btn btn-sm btn-github">
                        <svg width="16" height="16"><use xlink:href="#github-mark"></use></svg> GitHub
                    </a>
                    <a href="#" 
                       class="btn btn-sm btn-pdf" 
                       onclick="descargarArchivo('${tarea.archivo}'); return false;">
                        Descargar PDF
                    </a>
                </div>
            </div>
        `).join('');

        return `
            <div class="semana" id="semana-${data.semana}">
                <div class="tarea-img-container">
                    <img src="${data.imagen}" alt="Imagen Semana ${data.semana}" class="tarea-img">
                </div>
                <div class="semana-header" onclick="toggleTareas(this)">
                    <h3 class="semana-titulo">Semana ${data.semana}: ${data.titulo}</h3>
                    <a href="${data.githubRepo}" target="_blank" class="github-link" title="Ver repositorio de la semana">
                        <svg width="24" height="24"><use xlink:href="#github-mark"></use></svg>
                    </a>
                </div>
                <div class="progreso-container">
                    <div class="progreso-barra" style="width: 0%;"></div>
                </div>
                <div class="tareas">
                    <p class="p-3 text-muted">${data.descripcion}</p>
                    ${tareasHtml}
                </div>
            </div>
        `;
    }

    // 1. Carga automática de tarjetas
    document.addEventListener('DOMContentLoaded', () => {
        const contenedor = document.getElementById('semanas-container');
        if (contenedor) {
            contenedor.innerHTML = tareasData.map(crearTarjetaSemana).join('');
            // Inicializar el progreso para todas las semanas
            document.querySelectorAll('.semana').forEach(actualizarProgreso);
        }
    });

    // 2. Desplegar tareas
    // Función global llamada desde el HTML (onclick)
    function toggleTareas(titulo) {
        const semana = titulo.closest('.semana');
        const tareas = semana.querySelector('.tareas');
        
        if (tareas.classList.contains('show')) {
            tareas.classList.remove('show');
            titulo.classList.remove('active');
            // Esto es solo para que la animación de max-height se vea bien
            tareas.style.maxHeight = null;
        } else {
            // Es necesario recalcular el scrollHeight para que la transición funcione correctamente
            tareas.style.maxHeight = tareas.scrollHeight + "px";
            tareas.classList.add('show');
            titulo.classList.add('active');
        }
    }

    // 3. Marcar completadas
    // Función global llamada desde el HTML (onclick)
    function marcarTarea(checkbox) {
        const tarea = checkbox.closest('.tarea');
        const semana = checkbox.closest('.semana');

        if (checkbox.checked) {
            tarea.classList.add('tarea-completada');
        } else {
            tarea.classList.remove('tarea-completada');
        }
        actualizarProgreso(semana);
    }

    // 4. Barra de progreso
    function actualizarProgreso(semana) {
        const totalTareas = semana.querySelectorAll('.tarea').length;
        const tareasCompletadas = semana.querySelectorAll('.tarea-completada').length;

        if (totalTareas === 0) return;

        const porcentaje = (tareasCompletadas / totalTareas) * 100;
        const barra = semana.querySelector('.progreso-barra');
        barra.style.width = `${porcentaje.toFixed(0)}%`;
    }

    // 5. Botones funcionales (Descargar) - Implementación que usa su URL
    // Función global llamada desde el HTML (onclick)

        const githubRawUrl = `https://github.com/jeick95/Taller-Jeick/tree/main/${rutaArchivo}`;
